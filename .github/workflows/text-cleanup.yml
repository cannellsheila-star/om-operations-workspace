name: Repository text cleanup
on: [push]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/normalize_text.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name repository-maintenance
          git config user.email repository-maintenance@users.noreply.github.com
          git add -A
          git commit -m "Normalize repository text"
          git push
