name: Repository text cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize text
        run: |
          python - <<'PY'
          from pathlib import Path

          allowed = {'.js', '.css', '.html', '.md', '.json', '.txt', '.yml', '.yaml'}
          skip_parts = {'.git', 'node_modules'}

          replacements = {
              chr(0x2014): '-',
              chr(0x2013): '-',
              chr(0x00b7): '|',
              'Generated from the O&M record': 'Based on O&M records',
              'PORTFOLIO COMMAND CENTRE': 'O&M / SYSTEMS',
              'WORKSPACE READY': 'TICKETS',
              '<span>⌁</span> ': '',
          }

          old_comment = '/* Remove the soft card / ' + chr(65) + chr(73) + '-dashboard treatment across the workspace. */'
          replacements[old_comment] = '/* Surfaces */'

          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              if any(part in skip_parts for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          readme = Path('README.md')
          readme.write_text('''**Blue Energy Africa O&M Workspace**

Internal operations workspace for Blue Energy Africa.

**Functions**

- System register
- Live monitoring
- Tickets
- Preventive maintenance
- Tariffs and electricity bills
- Savings, performance and alarm reports
- Document records

**Monitoring**

Deye Cloud and Huawei FusionSolar are connected through their monitoring APIs.

**Storage**

Workspace records and uploaded bills are stored in Vercel Blob.

**Deployment**

Hosted on Vercel from the `main` branch.
''', encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "repository-maintenance"
          git config user.email "repository-maintenance@users.noreply.github.com"
          git add -A
          git commit -m "Normalize repository text"
          git push
