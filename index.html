<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Operations and maintenance workspace." />
    <title>O&M Workspace</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="amber-theme.css" />
    <link rel="stylesheet" href="monitoring-enhanced.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <nav class="nav-list">
          <div class="nav-group om-nav" id="om-nav">
            <button class="nav-parent active" type="button" data-nav="overview"><span>⌁</span> O&amp;M</button>
            <div class="nav-submenu" id="om-submenu">
              <button class="nav-item" data-nav="monitoring">Monitoring</button>
              <button class="nav-item" data-nav="tickets">Tickets</button>
              <button class="nav-item" data-nav="maintenance">Maintenance</button>
              <button class="nav-item" type="button" data-action="show-reports">Reports</button>
            </div>
          </div>
        </nav>
      </aside>

      <div class="workspace">
        <main class="main-content">
          <header class="topbar">
            <div>
              <p class="eyebrow" id="page-eyebrow">PORTFOLIO COMMAND CENTRE</p>
              <h1 id="page-title">Systems overview</h1>
            </div>
            <div class="topbar-actions">
              <button class="button button-muted" id="back-button" hidden>← Back</button>
              <button class="button button-primary" id="primary-action">Add system</button>
            </div>
          </header>

          <section id="app-view" aria-live="polite"></section>
        </main>
      </div>
    </div>

    <div class="modal-layer" id="modal-layer" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <h2 id="modal-title">New ticket</h2>
          <button class="modal-close" data-close-modal>Close</button>
        </div>
        <div id="modal-content"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="app.js"></script>
    <script src="restore-workflows.js"></script>
    <script src="automation-client.js"></script>
    <script src="monitoring-enhanced.js"></script>
    <script>
      // monitoring-workspace owns its own explicit render cycle. Suppress only its
      // legacy global DOM observer so its own renders cannot trigger an endless
      // render -> mutation -> render feedback loop.
      window.__omNativeMutationObserver = window.MutationObserver;
      window.MutationObserver = class MonitoringWorkspaceNoopObserver {
        constructor() {}
        observe() {}
        disconnect() {}
        takeRecords() { return []; }
      };
    </script>
    <script src="monitoring-workspace.js"></script>
    <script>
      window.MutationObserver = window.__omNativeMutationObserver;
      delete window.__omNativeMutationObserver;
    </script>
    <script src="fusionsolar-site-mapping.js"></script>
    <script src="fusionsolar-sites.js"></script>
    <script src="fusionsolar-standard.js"></script>
    <script src="fusionsolar-status.js"></script>
    <script>
      (() => {
        const decimalSelector = 'input[name="kwp"], input[name="kwh"]';
        const systemOverrideKey = "om-system-user-overrides-v1";
        const readSystemOverrides = () => {
          try {
            const parsed = JSON.parse(localStorage.getItem(systemOverrideKey) || "{}");
            return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
          } catch {
            return {};
          }
        };
        const writeSystemOverrides = (overrides) => localStorage.setItem(systemOverrideKey, JSON.stringify(overrides));

        const prepareSystemForm = (root = document) => {
          if (root.matches?.(decimalSelector)) root.step = "any";
          root.querySelectorAll?.(decimalSelector).forEach((input) => { input.step = "any"; });
          if (root.matches?.("#system-form")) root.noValidate = true;
          root.querySelectorAll?.("#system-form").forEach((form) => { form.noValidate = true; });
        };
        prepareSystemForm();
        new MutationObserver((mutations) => {
          mutations.forEach((mutation) => mutation.addedNodes.forEach((node) => {
            if (node.nodeType === 1) prepareSystemForm(node);
          }));
        }).observe(document.body, { childList: true, subtree: true });

        const numericFields = new Set(["kwp", "kwh", "systemCount", "ppaTenor", "eassTenor"]);
        const saveEditedSystem = (form) => {
          const editedId = form.dataset.systemId;
          if (!editedId) return false;
          const system = systems.find((item) => item.id === editedId);
          if (!system) {
            showToast("System record could not be found.");
            return true;
          }
          const data = new FormData(form);
          const name = String(data.get("name") || "").trim();
          if (!name) {
            showToast("Enter a system name before saving.");
            return true;
          }
          const persistedPatch = {};
          for (const [key, raw] of data.entries()) {
            if (key === "id") continue;
            if (numericFields.has(key)) {
              const value = String(raw).trim().replace(",", ".");
              const parsed = value === "" ? null : Number(value);
              system[key] = parsed;
              persistedPatch[key] = parsed;
            } else {
              const value = String(raw).trim();
              system[key] = value;
              persistedPatch[key] = value;
            }
          }
          system.systemCount = system.systemCount || 1;
          persistedPatch.systemCount = system.systemCount;
          system.monitoring = system.platform ? `${system.platform} · connection pending` : "Monitoring platform not recorded";
          system.alert = system.alert || "No monitoring exception recorded.";
          system.documents = system.documents || [];
          system.updates = ["System record updated today", ...(system.updates || [])];

          const overrides = readSystemOverrides();
          overrides[editedId] = { ...(overrides[editedId] || {}), ...persistedPatch };
          writeSystemOverrides(overrides);

          saveWorkspace();
          closeModal();
          renderSystemRecord(system.id);
          showToast("System record updated.");
          return true;
        };

        document.addEventListener("submit", (event) => {
          if (event.target?.id !== "system-form" || !event.target.dataset.systemId) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          saveEditedSystem(event.target);
        }, true);

        document.addEventListener("click", (event) => {
          const button = event.target.closest?.('#system-form button[type="submit"]');
          const form = button?.form;
          if (!form?.dataset.systemId) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          saveEditedSystem(form);
        }, true);

        const overrides = readSystemOverrides();
        let overrideStoreChanged = false;
        if (!overrides["SYS-012"]?.name) {
          overrides["SYS-012"] = { ...(overrides["SYS-012"] || {}), name: "Sleepover Phabeni Gate" };
          overrideStoreChanged = true;
        }
        if (!overrides["SYS-018"]?.name) {
          overrides["SYS-018"] = { ...(overrides["SYS-018"] || {}), name: "Sleepover Kruger Gate" };
          overrideStoreChanged = true;
        }
        if (overrideStoreChanged) writeSystemOverrides(overrides);

        let workspaceChanged = false;
        Object.entries(overrides).forEach(([id, patch]) => {
          const system = systems.find((item) => item.id === id);
          if (!system || !patch || typeof patch !== "object") return;
          Object.entries(patch).forEach(([key, value]) => {
            if (system[key] !== value) {
              system[key] = value;
              workspaceChanged = true;
            }
          });
        });
        if (workspaceChanged) {
          saveWorkspace();
          if (state.view === "overview") renderSystemRegister();
        }
      })();
    </script>
    <script>
      (() => {
        const reportsButton = document.querySelector("[data-action='show-reports']");

        document.addEventListener("click", (event) => {
          if (event.target.closest("[data-action='show-reports']")) {
            const tariffConfigured = systems.filter((system) => ["Municipal", "Eskom"].includes(system.gridSupply) && system.utilityTariff).length;
            const generationLinked = systems.filter((system) => findTelemetry(system)).length;
            const savingsReady = systems.filter((system) => ["Municipal", "Eskom"].includes(system.gridSupply) && system.utilityTariff && findTelemetry(system)).length;
            document.querySelectorAll(".nav-item, .nav-parent").forEach((item) => item.classList.remove("active"));
            reportsButton.classList.add("active");
            document.querySelector("#page-title").textContent = "Reports";
            document.querySelector("#page-eyebrow").textContent = "O&M / REPORTING";
            document.querySelector("#primary-action").hidden = true;
            document.querySelector("#back-button").hidden = true;
            document.querySelector("#app-view").innerHTML = `
              <p class="subtitle">Portfolio reporting is prepared from live systems, ticket status and completed maintenance records.</p>
              <section class="report-surface">
                <div class="report-header"><h2>Portfolio snapshot</h2><span>September 2026</span></div>
                <div class="report-metrics">
                  <div><span>Operational systems</span><strong>${systems.filter((system) => system.status === "Operational").length} / ${systems.length}</strong></div>
                  <div><span>Open tickets</span><strong>${tickets.filter((ticket) => ticket.status !== "Completed").length}</strong></div>
                  <div><span>PM visits due</span><strong>${maintenance.filter((item) => item.status !== "Completed").length}</strong></div>
                  <div><span>Quote approvals</span><strong>${tickets.filter((ticket) => ticket.status === "Quote Approval").length}</strong></div>
                </div>
              </section>
              <section class="report-surface">
                <div class="report-header"><h2>Report outputs</h2><span>Generated from the O&amp;M record</span></div>
                <div class="report-list">
                  <div><strong>System performance summary</strong><span>Operating state, monitoring updates and current exceptions</span></div>
                  <div><strong>Open work register</strong><span>Tickets, quotes, corrective work and responsible contractor</span></div>
                  <div><strong>Maintenance completion report</strong><span>Six-month schedule, exact completion dates and attached evidence</span></div>
                </div>
              </section>
              <section class="report-surface">
                <div class="report-header"><h2>Savings reports</h2><span>Grid-cost avoidance and contract cost</span></div>
                <div class="report-metrics">
                  <div><span>Utility tariffs recorded</span><strong>${tariffConfigured} / ${systems.length}</strong></div>
                  <div><span>Generation feeds linked</span><strong>${generationLinked} / ${systems.length}</strong></div>
                  <div><span>Savings reports ready</span><strong>${savingsReady}</strong></div>
                  <div><span>Tariffs still required</span><strong>${systems.length - tariffConfigured}</strong></div>
                </div>
                <div class="report-list">
                  <div><strong>Grid-cost avoidance</strong><span>Verified solar generation × the recorded Municipal or Eskom tariff</span></div>
                  <div><strong>Contract cost</strong><span>PPA energy charge plus EaaS battery charge, where applicable</span></div>
                  <div><strong>Net saving</strong><span>Grid-cost avoidance less contract cost; no savings value is shown until its tariff and generation inputs are verified</span></div>
                </div>
              </section>`;
          }
        });
      })();
    </script>
  </body>
</html>
