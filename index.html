<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Operations and maintenance workspace." />
    <title>O&M Workspace</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="amber-theme.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <nav class="nav-list">
          <div class="nav-group om-nav" id="om-nav">
            <button class="nav-parent active" type="button" data-nav="overview"><span>⌁</span> O&amp;M</button>
            <div class="nav-submenu" id="om-submenu">
              <button class="nav-item" data-nav="monitoring">Monitoring</button>
              <button class="nav-item" data-nav="tickets">Tickets</button>
              <button class="nav-item" data-nav="maintenance">Maintenance</button>
              <button class="nav-item" type="button" data-action="show-reports">Reports</button>
            </div>
          </div>
        </nav>

      </aside>

      <div class="workspace">
        <header class="global-bar">
          <button class="global-icon" type="button" aria-label="Toggle navigation">▯</button>
          <div class="global-actions">
            <button class="global-icon" type="button" aria-label="Notifications">♧</button>
            <button class="global-icon" type="button" aria-label="Display settings">☼</button>
            <button class="sign-out" type="button">↪ <span>Sign Out</span></button>
          </div>
        </header>

        <main class="main-content">
          <header class="topbar">
            <div>
              <p class="eyebrow" id="page-eyebrow">PORTFOLIO COMMAND CENTRE</p>
              <h1 id="page-title">Systems overview</h1>
            </div>
            <div class="topbar-actions">
              <button class="button button-muted" id="back-button" hidden>← Back</button>
              <button class="button button-primary" id="primary-action">Add system</button>
            </div>
          </header>

          <section id="app-view" aria-live="polite"></section>
        </main>
      </div>
    </div>

    <div class="modal-layer" id="modal-layer" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <div>
            <p class="eyebrow">O&amp;M WORKSPACE</p>
            <h2 id="modal-title">New ticket</h2>
          </div>
          <button class="icon-button" data-close-modal aria-label="Close">×</button>
        </div>
        <div id="modal-content"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="app.js"></script>
    <script src="automation-client.js"></script>
    <script>
      (() => {
        const reportsButton = document.querySelector("[data-action='show-reports']");

        document.addEventListener("click", (event) => {
          if (event.target.closest("[data-action='show-reports']")) {
            document.querySelectorAll(".nav-item, .nav-parent").forEach((item) => item.classList.remove("active"));
            reportsButton.classList.add("active");
            document.querySelector("#page-title").textContent = "Reports";
            document.querySelector("#page-eyebrow").textContent = "O&M / REPORTING";
            document.querySelector("#primary-action").hidden = true;
            document.querySelector("#back-button").hidden = true;
            document.querySelector("#app-view").innerHTML = `
              <p class="subtitle">Portfolio reporting is prepared from live systems, ticket status and completed maintenance records.</p>
              <section class="report-surface">
                <div class="report-header"><h2>Portfolio snapshot</h2><span>September 2026</span></div>
                <div class="report-metrics">
                  <div><span>Operational systems</span><strong>${systems.filter((system) => system.status === "Operational").length} / ${systems.length}</strong></div>
                  <div><span>Open tickets</span><strong>${tickets.filter((ticket) => ticket.status !== "Completed").length}</strong></div>
                  <div><span>PM visits due</span><strong>${maintenance.filter((item) => item.status !== "Completed").length}</strong></div>
                  <div><span>Quote approvals</span><strong>${tickets.filter((ticket) => ticket.status === "Quote Approval").length}</strong></div>
                </div>
              </section>
              <section class="report-surface">
                <div class="report-header"><h2>Report outputs</h2><span>Generated from the O&amp;M record</span></div>
                <div class="report-list">
                  <div><strong>System performance summary</strong><span>Operating state, monitoring updates and current exceptions</span></div>
                  <div><strong>Open work register</strong><span>Tickets, quotes, corrective work and responsible contractor</span></div>
                  <div><strong>Maintenance completion report</strong><span>Six-month schedule, exact completion dates and attached evidence</span></div>
                </div>
              </section>`;
          }
        });
      })();
    </script>
  </body>
</html>
