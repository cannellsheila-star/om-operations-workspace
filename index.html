<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AMBER 4 operations and maintenance workspace." />
    <title>AMBER 4 | O&M Workspace</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="amber-theme.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#systems" data-nav="systems" aria-label="AMBER 4 by Blue Energy Africa">
          <svg class="brand-mark" viewBox="0 0 38 38" aria-hidden="true">
            <circle cx="12" cy="5" r="1.7" /><circle cx="17" cy="8" r="1.6" /><circle cx="22" cy="11" r="1.8" />
            <circle cx="9" cy="11" r="1.5" /><circle cx="14" cy="14" r="2" /><circle cx="19" cy="17" r="1.7" /><circle cx="24" cy="20" r="1.5" />
            <circle cx="7" cy="17" r="1.5" /><circle cx="12" cy="20" r="1.8" /><circle cx="17" cy="23" r="2" /><circle cx="22" cy="26" r="1.7" />
            <circle cx="10" cy="26" r="1.6" /><circle cx="15" cy="29" r="1.6" /><circle cx="20" cy="32" r="1.4" /><circle cx="26" cy="30" r="1.4" />
          </svg>
          <span class="brand-copy"><strong>AMBER 4</strong><small>Blue Energy Africa</small></span>
        </a>

        <nav class="nav-list">
          <button class="quick-link" type="button"><span>☑</span> My Tasks</button>
          <div class="nav-group">
            <p>PORTFOLIO</p>
            <button class="nav-item active" data-nav="systems"><span>▦</span> Dashboard</button>
          </div>
          <div class="nav-group">
            <p>OPERATIONS</p>
            <button class="nav-item" data-nav="tickets"><span>⌁</span> Tickets</button>
            <button class="nav-item" data-nav="maintenance"><span>▣</span> Maintenance</button>
          </div>
        </nav>

        <div class="sidebar-note">
          <span class="eyebrow">LIVE O&M VIEW</span>
          <p>One portfolio record connects systems, work, maintenance, documents and email history.</p>
        </div>
      </aside>

      <div class="workspace">
        <header class="global-bar">
          <button class="global-icon" type="button" aria-label="Toggle navigation">▯</button>
          <div class="global-actions">
            <button class="global-icon" type="button" aria-label="Notifications">♧</button>
            <button class="global-icon" type="button" aria-label="Display settings">☼</button>
            <button class="sign-out" type="button">↪ <span>Sign Out</span></button>
          </div>
        </header>

        <main class="main-content">
          <header class="topbar">
            <div>
              <p class="eyebrow" id="page-eyebrow">PORTFOLIO COMMAND CENTRE</p>
              <h1 id="page-title">Systems overview</h1>
            </div>
            <div class="topbar-actions">
              <button class="button button-muted" id="back-button" hidden>← Back</button>
              <button class="button button-primary" id="primary-action">Add system</button>
            </div>
          </header>

          <section id="app-view" aria-live="polite"></section>
        </main>
      </div>
    </div>

    <div class="modal-layer" id="modal-layer" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <div>
            <p class="eyebrow">O&amp;M WORKSPACE</p>
            <h2 id="modal-title">New ticket</h2>
          </div>
          <button class="icon-button" data-close-modal aria-label="Close">×</button>
        </div>
        <div id="modal-content"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
